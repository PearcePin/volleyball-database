<text x="30" y="1550" class="title">Foreign Key References</text>
<text x="30" y="1595" class="ref">Season(league_id)  →  League(league_id)</text>
<text x="30" y="1628" class="ref">Season_Team(season_id)  →  Season(season_id)</text>
