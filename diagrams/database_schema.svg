<text x="30" y="1694" class="ref">Player_Team_Season(player_id)  →  Player(player_id)</text>
<text x="30" y="1727" class="ref">Player_Team_Season(season_id, team_id)  →  Season_Team(season_id, team_id)</text>
<text x="30" y="1760" class="ref">Match(season_id, home_team_id)  →  Season_Team(season_id, team_id)</text>
<text x="30" y="1793" class="ref">Match(season_id, away_team_id)  →  Season_Team(season_id, team_id)</text>
<text x="30" y="1826" class="ref">Match_Set(match_id)  →  Match(match_id)</text>
<text x="30" y="1859" class="ref">Player_Match_Stats(match_id, season_id)  →  Match(match_id, season_id)</text>
<text x="30" y="1892" class="ref">Player_Match_Stats(player_id, team_id, season_id)  →  Player_Team_Season(player_id, team_id, season_id)</text>
<text x="30" y="2033" class="sub">Read composite keys as a group. UNIQUE and CHECK details: docs/database_schema.md and sql/schema.sql.</text>
